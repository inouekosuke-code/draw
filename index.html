<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シンプルお絵かき</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 画面のスクロール・バウンス防止 */
      background-color: #ffffff;
      touch-action: none; /* 指やPencilでの画面ズーム・スクロールを無効化 */
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #clearBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: rgba(245, 245, 245, 0.85);
      backdrop-filter: blur(8px);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="clearBtn" aria-label="全消去">🗑️</button>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');

    // iPadのRetinaディスプレイで線がボヤけないように解像度を調整
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      
      // ペンの設定（太さ一定の黒ペン）
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let isDrawing = false;

    // 描画開始（Apple Pencil・指・マウス共通）
    canvas.addEventListener('pointerdown', (e) => {
      // Apple Pencilのみにしたい場合は下の1行のコメントを外す
      // if (e.pointerType !== 'pen') return;
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.clientX, e.clientY);
    });

    // 描画中
    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      ctx.lineTo(e.clientX, e.clientY);
      ctx.stroke();
    });

    // 描画終了
    const stopDrawing = () => { isDrawing = false; };
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    // 全消去ボタン
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // オフライン対応用 Service Worker の登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
