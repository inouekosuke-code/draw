<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>シンプルお絵かき (1920×1080)</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2c2c2e; /* キャンバス外側の背景色（ダークグレー） */
      touch-action: none;
      display: flex;
      flex-direction: column;
    }

    /* キャンバスの外側上部に配置するツールバー */
    .toolbar {
      width: 100%;
      height: 64px;
      padding: 0 20px;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid #3a3a3c;
    }

    .canvas-info {
      color: #aeaeb2;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #48484a;
      background-color: #2c2c2e;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }
    .tool-btn:active:not(:disabled) {
      background-color: #48484a;
    }
    .tool-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* 1920×1080キャンバスを中央に収めるエリア */
    .workspace {
      flex: 1;
      width: 100%;
      height: calc(100% - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    canvas {
      background-color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: block;
      /* 表示サイズはJS側で画面に収まる最大サイズ（16:9維持）に自動計算 */
    }
  </style>
</head>
<body>

  <!-- 1920×1080の外側（上部）に配置されたボタンバー -->
  <div class="toolbar">
    <span class="canvas-info">1920 × 1080</span>
    <div class="btn-group">
      <button id="undoBtn" class="tool-btn" aria-label="戻る" disabled>↩</button>
      <button id="redoBtn" class="tool-btn" aria-label="進む" disabled>↪</button>
      <button id="clearBtn" class="tool-btn" aria-label="全消去">🗑️</button>
    </div>
  </div>

  <!-- キャンバス配置エリア -->
  <div class="workspace" id="workspace">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const workspace = document.getElementById('workspace');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const clearBtn = document.getElementById('clearBtn');

    // 内部解像度は常に1920×1080で固定
    const CANVAS_WIDTH = 1920;
    const CANVAS_HEIGHT = 1080;
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // 履歴管理用の配列（最大30手前まで保存）
    let history = [];
    let historyStep = -1;
    const MAX_HISTORY = 30;

    function setPenStyle() {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 10; // 1920×1080基準でのペンの太さ（必要に応じて変更）
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    setPenStyle();

    // iPadの画面サイズに合わせて1920×1080の見た目の表示サイズだけをフィットさせる
    function fitCanvasToScreen() {
      const padding = 32; // 上下左右の余白合計
      const availWidth = workspace.clientWidth - padding;
      const availHeight = workspace.clientHeight - padding;

      const scale = Math.min(availWidth / CANVAS_WIDTH, availHeight / CANVAS_HEIGHT);
      canvas.style.width = `${Math.floor(CANVAS_WIDTH * scale)}px`;
      canvas.style.height = `${Math.floor(CANVAS_HEIGHT * scale)}px`;
    }
    fitCanvasToScreen();
    window.addEventListener('resize', fitCanvasToScreen);

    // 画面上のタッチ位置を1920×1080の正確な座標に変換する関数
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_WIDTH / rect.width;
      const scaleY = CANVAS_HEIGHT / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    // 現在のキャンバス状態を履歴に保存
    function saveState() {
      historyStep++;
      if (historyStep < history.length) {
        history.length = historyStep;
      }
      history.push(ctx.getImageData(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT));
      if (history.length > MAX_HISTORY) {
        history.shift();
        historyStep--;
      }
      updateButtons();
    }

    // 履歴からキャンバスを復元
    function restoreState(step) {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.putImageData(history[step], 0, 0);
      updateButtons();
    }

    function updateButtons() {
      undoBtn.disabled = historyStep <= 0;
      redoBtn.disabled = historyStep >= history.length - 1;
    }

    // 初期状態を保存
    saveState();

    let isDrawing = false;

    canvas.addEventListener('pointerdown', (e) => {
      // Apple Pencilのみにする場合は下の1行のコメントを外す
      // if (e.pointerType !== 'pen') return;
      isDrawing = true;
      const pos = getCanvasCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });

    const stopDrawing = () => {
      if (!isDrawing) return;
      isDrawing = false;
      saveState();
    };
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    // 戻るボタン
    undoBtn.addEventListener('click', () => {
      if (historyStep > 0) {
        historyStep--;
        restoreState(historyStep);
      }
    });

    // 進むボタン
    redoBtn.addEventListener('click', () => {
      if (historyStep < history.length - 1) {
        historyStep++;
        restoreState(historyStep);
      }
    });

    // 全消去ボタン
    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      saveState();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
